name: Report a problem
description: Tell us what happened in IDT-YT Downloader.
body:
  - type: input
    id: version
    attributes:
      label: App version and Windows version
      placeholder: For example, 2.3.0 on Windows 11, 64-bit
    validations:
      required: true
  - type: dropdown
    id: source
    attributes:
      label: Where did it happen?
      options:
        - Desire Tree Audio
        - YouTube → MP3
        - Settings or another part of the app
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Include the steps, what you expected, and any plain error message.
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Optional details or screenshot
      description: Remove personal paths, private links and other personal information before posting.
