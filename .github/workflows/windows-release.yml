name: Windows release verification
on:
  push:
    branches: [codex/portable-exe]
  workflow_dispatch:
permissions:
  # GitHub requires push-level access to read unpublished draft-release assets.
  # The test script uses only GET requests; it never publishes a release.
  contents: write
jobs:
  portable:
    runs-on: windows-2025
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install recorded test environment
        run: python -m pip install -r requirements-lock.txt
      - name: Verify candidate artifacts and test both portable formats
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/ci_windows_check.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: windows-portable-verification
          path: qa/ci-verification.json
          if-no-files-found: ignore
